<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Conditionals</title>
  <link href="https://www.sc.edu/favicon.ico" rel="icon" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="page-header">
    <h1>Conditionals</h1>
    <h2>JavaScript If Statements</h2>
  </header>

  <!-- navigation bar -->
  <nav class="nav-bar">
    <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">&#9660;</button>
    <ul id="nav-list" class="nav-list">
      <li class="nav-item active" data-exercise="1">Exercise 1</li>
      <li class="nav-item" data-exercise="2">Exercise 2</li>
    </ul>
  </nav>

  <main class="main-content">
    <!-- exercise 1: how many minutes until class? -->
    <section id="exercise1" class="exercise-section">
      <h3 class="section-title">How many minutes until class?</h3>

      <div class="exercise-body center">
        <label for="minutes-range" class="range-label">Minutes until class:
          <span id="range-value">30</span>
        </label>

        <div class="range-row">
          <span class="range-end">0</span>
          <input id="minutes-range" type="range" min="0" max="60" value="30" />
          <span class="range-end">60</span>
        </div>

        <p id="range-message" class="message-box"></p>
      </div>
    </section>

    <!-- exercise 2: countdown till class -->
    <section id="exercise2" class="exercise-section hidden">
      <h3 class="section-title">Countdown to class</h3>

      <div class="exercise-body center">
        <p id="current-time" class="time-display"></p>
        <p id="countdown-message" class="message-box"></p>
        <button id="refresh-btn" class="refresh-btn">Refresh &#x1F504;</button>
      </div>
    </section>
  </main>

  <footer class="page-footer">
    <p>Solomon Ellis-Summers | Web Applications: CSCE 242</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
