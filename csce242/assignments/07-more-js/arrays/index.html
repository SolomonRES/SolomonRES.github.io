<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrays</title>
  <link href="https://www.sc.edu/favicon.ico" rel="icon" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="wrapper">
    <div class="card">
      <!-- header band -->
      <div class="card-header">
        <h1 class="card-heading">Assignment 10</h1>
        <div class="heading-rule"></div>
        <h2 class="card-subtitle">Arrays</h2>
      </div>

      <!-- mood selector -->
      <div class="mood-row">
        <label for="mood-select" class="mood-label">Pick Your Mood</label>
        <select id="mood-select" class="mood-select">
          <option value="">Select</option>
          <option value="happy">Happy</option>
          <option value="sad">Sad</option>
        </select>
      </div>

      <!-- song list -->
      <div id="song-list" class="song-list"></div>

      <!-- video player -->
      <div id="video-container" class="video-container">
        <iframe
          id="video-player"
          width="100%"
          height="315"
          src=""
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </main>

  <footer class="page-footer">
    <p>Solomon Ellis-Summers | Web Applications: CSCE 242</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
