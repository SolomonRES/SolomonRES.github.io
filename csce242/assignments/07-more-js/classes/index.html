<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classes</title>
  <link href="https://www.sc.edu/favicon.ico" rel="icon" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="wrapper">
    <div class="card">
      <!-- header -->
      <div class="card-header">
        <h1 class="card-heading">Classes</h1>
        <div class="heading-rule"></div>
        <h2 class="card-subtitle">Music</h2>
      </div>

      <!-- song gallery -->
      <div id="gallery" class="gallery"></div>
    </div>
  </main>

  <!-- modal overlay -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <div class="modal-body">
        <div class="modal-video">
          <iframe id="modal-iframe" width="100%" height="250"
            src="" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
        </div>
        <div class="modal-info">
          <h3 id="modal-title"></h3>
          <p id="modal-artist"></p>
          <p id="modal-album"></p>
          <p id="modal-genre"></p>
        </div>
      </div>
    </div>
  </div>

  <footer class="page-footer">
    <p>Solomon Ellis-Summers | Web Applications: CSCE 242</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
