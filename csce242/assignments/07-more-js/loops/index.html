<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Loops</title>
    <link href="https://www.sc.edu/favicon.ico" rel="icon" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>JavaScript Loops</h1>
        <p class="info">Solomon Ellis-Summers &bull; CSCE 242: Web Applications</p>
    </header>

    <main>
        <div class="tank-wrapper">
            <!-- fish bowl css art -->
            <div class="bowl">
                <div class="bowl-rim"></div>
                <div class="bowl-glass">
                    <div class="water">
                        <div class="water-surface"></div>

                        <!-- css fish swimming in the tank -->
                        <div class="fish">
                            <div class="fish-body">
                                <div class="fish-eye"></div>
                                <div class="fish-mouth"></div>
                            </div>
                            <div class="fish-tail"></div>
                            <div class="fish-fin-top"></div>
                            <div class="fish-fin-bottom"></div>
                        </div>

                        <!-- small fish -->
                        <div class="fish small-fish">
                            <div class="fish-body">
                                <div class="fish-eye"></div>
                                <div class="fish-mouth"></div>
                            </div>
                            <div class="fish-tail"></div>
                            <div class="fish-fin-top"></div>
                            <div class="fish-fin-bottom"></div>
                        </div>

                        <!-- little plant -->
                        <div class="plant">
                            <div class="plant-leaf leaf-1"></div>
                            <div class="plant-leaf leaf-2"></div>
                            <div class="plant-leaf leaf-3"></div>
                        </div>

                        <div id="bubble-container" class="bubble-container"></div>
                    </div>
                    <!-- glass shine effect -->
                    <div class="glass-shine"></div>
                    <div class="glass-shine-small"></div>
                </div>
                <div class="bowl-base"></div>
                <!-- shadow under the bowl -->
                <div class="bowl-shadow"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Solomon Ellis-Summers</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
